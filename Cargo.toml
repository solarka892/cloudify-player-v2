[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/solarka892/cloudify-player-v2"
publish = false

[workspace.dependencies]
soundcloud = { path = "crates/soundcloud" }
diary = { path = "crates/diary" }

reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "http2",
  "system-proxy",
  "charset",
  "json",
  "query",
  "gzip",
  "brotli",
] }
# Local time and the system time zone for the diary.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
iana-time-zone = "0.1"
regex = "1"
# SQLite built in, so the diary needs nothing from the system.
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
url = "2"
wiremock = "0.6"

# Tauri builds every crate in release mode with these; a smaller binary is the point of Tauri.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
