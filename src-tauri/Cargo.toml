[package]
name = "cloudify"
description = "Unofficial SoundCloud desktop client"
authors = ["solarka892"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# A distinct lib name keeps it from clashing with the `cloudify` binary on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "cloudify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
soundcloud.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
# The OS keychain: Keychain on macOS, Credential Manager on Windows, Secret Service on Linux.
keyring = "4"
